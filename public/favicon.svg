<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Vibrant Automotive Cyan-to-Blue Linear Gradient -->
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Deep Ceramic Tile Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Subtle Inner Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00F2FE" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Obsidian Badge -->
  <rect width="100" height="100" rx="22" fill="url(#bg-grad)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />
  
  <!-- Subtle Internal Telemetry Frame -->
  <rect x="6" y="6" width="88" height="88" rx="17" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />

  <!-- Bold Geometric Chiseled "S" Emblem (Solid Automotive Faceted Form) -->
  <path d="M 76 22 
           L 32 22 
           L 20 34 
           L 20 52 
           L 34 58 
           L 66 58 
           L 66 68 
           L 22 68 
           L 22 78 
           L 68 78 
           L 80 66 
           L 80 48 
           L 66 42 
           L 34 42 
           L 34 32 
           L 76 32 
           Z" 
        fill="url(#cyber-grad)" 
        filter="url(#glow)" />

  <!-- Precision Automotive Apex Accents -->
  <circle cx="76" cy="27" r="2.5" fill="#00F2FE" />
  <circle cx="24" cy="73" r="2.5" fill="#38BDF8" />
</svg>
